<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Apartment Portal</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: #ebf2f7;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .auth-card {
      background: #ffffff;
      padding: 36px 32px;
      border-radius: 16px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.05);
      width: 100%;
      max-width: 440px;
      text-align: center;
    }

    .hidden {
      display: none !important;
    }

    .icon-box {
      width: 56px;
      height: 56px;
      background-color: #2563eb;
      border-radius: 50%;
      display: flex;
      justify-content: center;
      align-items: center;
      margin: 0 auto 16px auto;
      color: #ffffff;
    }

    .icon-box svg {
      width: 26px;
      height: 26px;
      fill: currentColor;
    }

    h2 {
      font-size: 22px;
      color: #1e293b;
      margin-bottom: 4px;
      font-weight: 700;
    }

    .subtitle {
      font-size: 13px;
      color: #64748b;
      margin-bottom: 24px;
    }

    .form-group {
      text-align: left;
      margin-bottom: 16px;
    }

    label {
      display: block;
      font-size: 11px;
      font-weight: 700;
      color: #64748b;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 6px;
    }

    select, input {
      width: 100%;
      padding: 11px 14px;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      font-size: 13px;
      outline: none;
      color: #334155;
      background-color: #ffffff;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    select:focus, input:focus {
      border-color: #2563eb;
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15);
    }

    .btn-submit {
      width: 100%;
      background-color: #2563eb;
      color: #ffffff;
      border: none;
      padding: 12px;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      margin-top: 20px;
      transition: background-color 0.2s;
    }

    .btn-submit:hover {
      background-color: #1d4ed8;
    }

    .footer-text {
      margin-top: 20px;
      font-size: 12px;
      color: #64748b;
    }

    .footer-text a {
      color: #2563eb;
      text-decoration: none;
      font-weight: 700;
      cursor: pointer;
    }

    .footer-text a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>

  <!-- LOGIN CARD -->
  <div class="auth-card" id="loginCard">
    <div class="icon-box">
      <svg viewBox="0 0 24 24"><path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-7 3c1.66 0 3 1.34 3 3s-1.34 3-3 3-3-1.34-3-3 1.34-3 3-3zm6 12H6v-1.4c0-2 4-3.1 6-3.1s6 1.1 6 3.1V18z"/></svg>
    </div>

    <h2>Apartment Portal</h2>
    <p class="subtitle">Log in to manage society funds & operations</p>

    <form id="loginForm">
      <div class="form-group">
        <label for="loginRole">SELECT ROLE</label>
        <select id="loginRole">
          <option value="admin">Admin / Secretary</option>
          <option value="resident">Resident / Flat Owner</option>
          <option value="security">Security Guard / Gatekeeper</option>
        </select>
      </div>

      <div class="form-group">
        <label for="loginFlatNo">FLAT NO / EMAIL</label>
        <input type="text" id="loginFlatNo" placeholder="Enter flat no or email">
      </div>

      <div class="form-group">
        <label for="loginPassword">PASSWORD</label>
        <input type="password" id="loginPassword" placeholder="••••••" required>
      </div>

      <button type="submit" class="btn-submit">
        Login to Dashboard &rarr;
      </button>
    </form>

    <p class="footer-text">
      Don't have an apartment account? <a href="#" id="goToSignUp">Sign Up</a>
    </p>
  </div>

  <!-- SIGN UP CARD (Hidden by default) -->
  <div class="auth-card hidden" id="signupCard">
    <div class="icon-box">
      <svg viewBox="0 0 24 24"><path d="M15 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm-9-2V7H4v3H1v2h3v3h2v-3h3v-2H6zm9 4c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>
    </div>

    <h2>Create Account</h2>
    <p class="subtitle">Register your society or flat account</p>

    <form id="signupForm">
      <div class="form-group">
        <label for="fullName">FULL NAME & FLAT NO</label>
        <input type="text" id="fullName" placeholder="e.g. Ramesh Kumar - Flat 101" required>
      </div>

      <div class="form-group">
        <label for="societyName">APARTMENT / SOCIETY NAME</label>
        <input type="text" id="societyName" value="Gokul Dham Society" required>
      </div>

      <div class="form-group">
        <label for="signupRole">SELECT ROLE</label>
        <select id="signupRole">
          <option value="admin">Admin / Secretary</option>
          <option value="resident">Resident / Flat Owner</option>
          <option value="security">Security Guard / Gatekeeper</option>
        </select>
      </div>

      <div class="form-group">
        <label for="emailMobile">EMAIL / MOBILE</label>
        <input type="text" id="emailMobile" placeholder="e.g. admin@gokuldham.com" required>
      </div>

      <div class="form-group">
        <label for="signupPassword">CREATE PASSWORD</label>
        <input type="password" id="signupPassword" placeholder="••••••" required>
      </div>

      <button type="submit" class="btn-submit">
        Create Account & Proceed &rarr;
      </button>
    </form>

    <p class="footer-text">
      Already have an account? <a href="#" id="goToLogIn">Log In</a>
    </p>
  </div>

  <script>
    const loginCard = document.getElementById('loginCard');
    const signupCard = document.getElementById('signupCard');
    const goToSignUp = document.getElementById('goToSignUp');
    const goToLogIn = document.getElementById('goToLogIn');

    goToSignUp.addEventListener('click', (e) => {
      e.preventDefault();
      loginCard.classList.add('hidden');
      signupCard.classList.remove('hidden');
    });

    goToLogIn.addEventListener('click', (e) => {
      e.preventDefault();
      signupCard.classList.add('hidden');
      loginCard.classList.remove('hidden');
    });

    document.getElementById('loginForm').addEventListener('submit', (e) => {
      e.preventDefault();
      const selectedRole = document.getElementById('loginRole').value;
      localStorage.setItem('userRole', selectedRole);
      window.location.href = 'dashboard.html';
    });

    document.getElementById('signupForm').addEventListener('submit', (e) => {
      e.preventDefault();
      const selectedRole = document.getElementById('signupRole').value;
      localStorage.setItem('userRole', selectedRole);
      alert('Account Created Successfully!');
      window.location.href = 'dashboard.html';
    });
  </script>
</body>
</html>
