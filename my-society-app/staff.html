<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gokul Dham Society - Society Staff Directory</title>
    <!-- FontAwesome Icons CDN -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <!-- Link CSS -->
    <link rel="stylesheet" href="staff.css">
</head>
<body>

    <!-- TOP NAVIGATION BAR -->
    <header class="navbar">
        <div class="nav-left">
            <div class="logo-box">
                <svg class="icon" viewBox="0 0 24 24" style="width: 18px; height: 18px;"><path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-7 3c1.66 0 3 1.34 3 3s-1.34 3-3 3-3-1.34-3-3 1.34-3 3-3zm6 12H6v-1.4c0-2 4-3.1 6-3.1s6 1.1 6 3.1V18z"/></svg>
            </div>
            <div class="brand-info">
                <div class="brand-title-row">
                    <h3 class="societyNameText">Gokul Dham Society</h3>
                    <button class="edit-btn" onclick="openEditModal()" title="Edit Name">
                        <svg class="icon" viewBox="0 0 24 24" style="width: 11px; height: 11px;"><path d="M3 17.25V21h3.75L17.81 9.94l-3.75-3.75L3 17.25zM20.71 7.04c.39-.39.39-1.02 0-1.41l-2.34-2.34c-.39-.39-1.02-.39-1.41 0l-1.83 1.83 3.75 3.75 1.83-1.83z"/></svg>
                    </button>
                </div>
                <p>Admin Management Portal</p>
            </div>
        </div>

        <nav class="nav-menu">
            <a href="dashboard.html" class="nav-item">Dashboard</a>
            <a href="flats.html" class="nav-item">Flats & Ledger</a>
            <a href="vehicle.html" class="nav-item">Vehicle Parking</a>
            <a href="helpdesk.html" class="nav-item">Helpdesk</a>
            <a href="bookings.html" class="nav-item">Bookings</a>
            <a href="visitors.html" class="nav-item">Gatekeeper Log</a>
            <a href="staff.html" class="nav-item active">Staff Directory</a>
        </nav>

        <div class="nav-right">
            <div class="notification-icon">
                <svg class="icon" viewBox="0 0 24 24" style="width: 15px; height: 15px;"><path d="M12 22c1.1 0 2-.9 2-2h-4c0 1.1.89 2 2 2zm6-6v-5c0-3.07-1.64-5.64-4.5-6.32V4c0-.83-.67-1.5-1.5-1.5s-1.5.67-1.5 1.5v.68C7.63 5.36 6 7.92 6 11v5l-2 2v1h16v-1l-2-2z"/></svg>
                <span class="badge">3</span>
            </div>
            <a href="index.html" class="logout-btn">
                <svg class="icon" viewBox="0 0 24 24" style="width: 14px; height: 14px;"><path d="M10.09 15.59L11.5 17l5-5-5-5-1.41 1.41L12.67 11H3v2h9.67l-2.58 2.59z"/></svg>
            </a>
        </div>
    </header>

    <!-- MAIN CONTAINER -->
    <main class="main-container">
        <div class="card">
            <div class="card-header-flex">
                <div>
                    <h2 class="page-title">Society Staff Directory</h2>
                    <p class="page-desc">Watchman, Sweeper, Plumber, Electrician contact numbers</p>
                </div>
                <button onclick="openModal()" class="primary-btn">+ Add New Staff</button>
            </div>

            <!-- Staff Grid Cards Container -->
            <div class="staff-grid" id="staff-grid-container">
                <!-- Dynamic Cards -->
            </div>
        </div>
    </main>

    <!-- Modal: Add New Staff -->
    <div id="modal-staff" class="modal hidden">
        <div class="modal-content">
            <h3>Add New Society Staff</h3>
            <form onsubmit="handleAddStaff(event)" class="modal-form">
                <input type="text" id="staff-name" placeholder="Staff Name (e.g. Ramesh Kumar)" required>
                <input type="text" id="staff-role" placeholder="Role / Designation (e.g. On-Call Plumber)" required>
                <input type="text" id="staff-phone" placeholder="Phone Number (e.g. +91 9876543210)" required>
                <div class="modal-actions">
                    <button type="button" onclick="closeModal()" class="cancel-btn">Cancel</button>
                    <button type="submit" class="submit-btn">Add Staff</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Edit Society Name Modal -->
    <div class="modal-overlay hidden" id="editModal">
        <div class="modal-card">
            <h3>Edit Society Name</h3>
            <input type="text" id="societyInput" placeholder="Enter new society name">
            <div class="modal-actions">
                <button class="btn-cancel" onclick="closeEditModal()">Cancel</button>
                <button class="btn-update" onclick="saveSocietyName()">Update Name</button>
            </div>
        </div>
    </div>

    <!-- Link JS -->
    <script src="staff.js"></script>
</body>
</html>
